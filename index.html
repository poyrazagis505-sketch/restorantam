<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Menü</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script>
  // 404.html tarafından yönlendirilen gerçek adresi geri yükle.
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
  }(window.location));
</script>
</head>
<body>

  <div id="app">
    <div id="loading-state" class="state-message">Menü yükleniyor...</div>

    <div id="not-found-state" class="state-message" style="display:none;"></div>

    <!-- KARŞILAMA EKRANI -->
    <div id="landing-view" class="landing-view" style="display:none;">
      <img id="landing-logo" class="landing-logo" style="display:none;" alt="">
      <h1 id="landing-name" class="landing-name"></h1>
      <p id="landing-subtitle" class="landing-subtitle"></p>
      <button id="open-menu-btn" class="open-menu-btn">Menü</button>
    </div>

    <!-- MENÜ EKRANI -->
    <div id="menu-view" class="menu-view">
      <div class="menu-view-header">
        <button id="back-to-landing-btn" class="back-btn">‹ Geri</button>
        <span id="menu-view-title" class="menu-view-title"></span>
      </div>

      <nav id="category-tabs" class="category-tabs"></nav>

      <main id="product-grid" class="product-grid"></main>
    </div>
  </div>

  <a id="admin-link" href="admin.html" class="admin-gear" title="Admin Girişi">⚙</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
