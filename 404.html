<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Menum</title>
<script>
  // GitHub Pages statik bir sunucu olduğu için "/restoran/ahmet-usta" gibi
  // adresler doğrudan bir dosyaya karşılık gelmiyor ve 404 sayfasına düşüyor.
  // Bu script, adresi index.html'e yönlendirip orijinal yolu geri kazandırıyor.
  //
  // Kendi alan adınızı (ör. menum.com) kök dizine bağladıysanız
  // pathSegmentsToKeep = 0 olarak kalmalı. Eğer siteniz
  // "kullaniciadi.github.io/repo-adi" şeklinde bir alt klasördeyse
  // bu değeri 1 yapmanız gerekir.
  var pathSegmentsToKeep = 1;

  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
