<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Menum</title>
<script>
  // GitHub Pages statik bir sunucu olduğu için "/restoran/ahmet-usta" gibi
  // adresler doğrudan bir dosyaya karşılık gelmiyor ve bu 404 sayfasına düşüyor.
  // Bu script, adresi index.html'e yönlendirip orijinal yolu geri kazandırıyor.
  //
  // pathSegmentsToKeep:
  //   - Kendi alan adınızı (ör. menum.com) kök dizine bağladıysanız: 0
  //   - "kullaniciadi.github.io/repo-adi" şeklinde bir alt klasördeyseniz: 1
  var pathSegmentsToKeep = 1;

  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
